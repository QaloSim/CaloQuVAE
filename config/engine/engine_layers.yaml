_target_: engine.engine_layers_ema.EngineLayersEMA
learning_rate: 5.0e-5
weight_decay: 0.0

n_batches_log_train: 10
n_batches_log_val: 1

beta_latent_start: 1.0
beta_latent_end: 3.0
beta_hits_start: 1.0
beta_hits_end: 3.0
beta_gumbel_epoch_start: 0
beta_gumbel_end: 2.0
beta_gumbel_duration: 100     # Duration in epochs (replaces epoch_end)

slope_act_fct_start: 0.05
slope_act_fct_end: 0.

lr_scheduler_type: cosine     # options: cosine | constant
lr_scheduler_T_max: 50       # Epochs over which LR decays from base to eta_min
lr_scheduler_eta_min: 5.0e-6

ema_decay: 0.999                # EMA decay rate for model weights (0.0 = disabled, typical: 0.999)

# train_vae_separate: 1
training_mode: ae