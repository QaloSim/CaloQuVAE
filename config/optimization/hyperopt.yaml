defaults:
  - _self_

# Pointer to the model config you want to optimize
base_model_config: "config" # The name of your existing model config file

experiment:
  name: "CaloQVAE_Hyperopt_Compact"
  total_trials: 36
  save_dir_root: "/home/leozhu/CaloQuVAE/wandb-outputs"
  resume: true
  n_sobol: 8

resources:
  gpus: [0, 1, 2]
  max_parallelism: 3


fixed_data_settings:
  data_config_name: "AtlasCustom2"
  # data_config_name: "TestData"


  
  # This overwrites the validation loop list
  validation_datasets:
    # - TestData
    - AtlasCustom1GeV
    - AtlasCustom10GeV
    - AtlasCustom50GeV
    - AtlasCustom100GeV
    - AtlasCustom250GeV


# Training overrides specific to optimization (faster/shorter runs)
training:
  n_epochs: 200
  eval_window: 5
  epoch_start: 0

# The Search Space (Parsed dynamically in main.py)
search_space:
  - name: "model.mse_weight"
    type: "range"
    bounds: [0.1, 1.0]
    log_scale: true

  - name: "model.loss_coeff.r_loss_coeff"
    type: "range"
    bounds: [0.0, 10.0]

  - name: "engine.learning_rate"
    type: "range"
    bounds: [1e-5, 1e-3]
    log_scale: true

  - name: "engine.weight_decay"
    type: "range"
    bounds: [0.0, 1e-2]

  


  
# Metrics
objectives:
  loss_metric:
    minimize: true

# Manual Seeds
manual_seeds:
  - model.mse_weight: 0.5
    model.loss_coeff.r_loss_coeff: 0.0
    engine.learning_rate: 0.00005
    engine.weight_decay: 0.0
